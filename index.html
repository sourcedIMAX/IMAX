<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080c14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HabitFlow Hifdh" />
  <title>HabitFlow — Ha'il Hifdh, Mutuun & Reading Planner</title>
  <style>
    :root {
      --bg-main: #080c14;
      --bg-card: #111827;
      --bg-card-alt: #0b111e;
      --bg-hover: #1e293b;
      --border: #1f2937;
      --border-light: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-dim: rgba(16, 185, 129, 0.14);
      --sky: #0ea5e9;
      --sky-dim: rgba(14, 165, 233, 0.14);
      --violet: #8b5cf6;
      --violet-dim: rgba(139, 92, 246, 0.14);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.14);
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: 60px;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(8, 12, 20, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #042f2e;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-emerald { background: var(--emerald-dim); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .badge-sky { background: var(--sky-dim); color: #38bdf8; border-color: rgba(14, 165, 233, 0.3); }
    .badge-violet { background: var(--violet-dim); color: #a78bfa; border-color: rgba(139, 92, 246, 0.3); }
    .badge-amber { background: var(--amber-dim); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .clock-box {
      text-align: right;
      padding-right: 10px;
      border-right: 1px solid var(--border);
    }

    .clock-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #34d399;
    }

    .clock-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    select, input[type="text"], input[type="number"], input[type="time"] {
      background: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--emerald);
    }

    .btn {
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--emerald);
      color: #052e16;
      font-weight: 700;
    }
    .btn-primary:hover { background: #34d399; }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-light);
    }
    .btn-secondary:hover { background: #334155; }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
    }

    .prayer-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
